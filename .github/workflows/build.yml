name: Build executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  check-version:
    # A tag that disagrees with APP_VERSION ships binaries that report the
    # wrong version. The updater compares the two, so drift would tell
    # everyone they are permanently out of date.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match APP_VERSION
        run: |
          version=$(python -c "import re; print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('soundboard/config.py').read()).group(1))")
          if [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "Tag ${{ github.ref_name }} does not match APP_VERSION $version (expected v$version)."
            echo "Bump APP_VERSION in soundboard/config.py, or retag."
            exit 1
          fi
          echo "${{ github.ref_name }} matches APP_VERSION $version."

  build:
    needs: check-version
    # check-version only runs for tags; a skipped dependency would skip this
    # too, which would break manual dispatch builds.
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: soundboard-windows
          - os: macos-latest
            artifact: soundboard-macos
          - os: ubuntu-latest
            artifact: soundboard-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install -r requirements.txt -r build-requirements.txt

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        # pynput imports its backend by name at runtime, so PyInstaller never
        # sees it; name it here or the build dies on the first hotkey.
        run: pyinstaller --onefile --windowed --icon assets/icon.ico --add-data "assets/icon.png;assets" --add-data "assets/tutorial;assets/tutorial" --collect-data customtkinter --hidden-import PIL._tkinter_finder --collect-all yt_dlp --collect-all imageio_ffmpeg --collect-all pystray --name soundboard --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 main.py

      - name: Build executable (macOS)
        if: runner.os == 'macOS'
        run: |
          # A .app must be onedir; onefile .apps don't open reliably and can't be
          # granted Input Monitoring.
          # pynput imports its backend by name at runtime, so PyInstaller never
          # sees it; name it here or the build dies on the first hotkey.
          pyinstaller --onedir --windowed --icon assets/icon.icns --add-data "assets/icon.png:assets" --add-data "assets/tutorial:assets/tutorial" --collect-data customtkinter --hidden-import PIL._tkinter_finder --collect-all yt_dlp --collect-all imageio_ffmpeg --collect-all pystray --name soundboard --hidden-import pynput.keyboard._darwin --hidden-import pynput.mouse._darwin main.py
          plutil -insert NSMicrophoneUsageDescription -string "Soundboard mixes your microphone with sound clips and sends them to your virtual audio cable." dist/soundboard.app/Contents/Info.plist
          codesign --force --deep -s - dist/soundboard.app

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        # pynput imports its backend by name at runtime, so PyInstaller never
        # sees it; name it here or the build dies on the first hotkey.
        run: pyinstaller --onefile --windowed --add-data "assets/icon.png:assets" --add-data "assets/tutorial:assets/tutorial" --collect-data customtkinter --hidden-import PIL._tkinter_finder --collect-all yt_dlp --collect-all imageio_ffmpeg --collect-all pystray --name soundboard --hidden-import pynput.keyboard._xorg --hidden-import pynput.mouse._xorg main.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\soundboard.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto keeps the bundle's symlinks; zip -r copies them and breaks the signature.
        run: ditto -c -k --keepParent dist/soundboard.app ${{ matrix.artifact }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r ../${{ matrix.artifact }}.zip soundboard

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Record yt-dlp version
        if: runner.os == 'Linux'
        run: python -c "import yt_dlp.version as v; print(v.__version__)" > ytdlp-version.txt

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ytdlp-version
          path: ytdlp-version.txt

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ytdlp-version
          path: .

      - name: Create GitHub release with builds attached
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # check-ytdlp.yml reads this line to spot outdated downloaders.
          notes="Built with yt-dlp $(cat ytdlp-version.txt)"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" artifacts/soundboard-*/*.zip \
              --repo "$REPO" \
              --title "$TAG" \
              --notes "$notes" \
              --generate-notes
            exit 0
          fi
          # Publishing from the web UI creates the release before this job
          # runs, so there is nothing left to create. Upload into the
          # existing release instead, keeping the notes it already has and
          # adding the yt-dlp line check-ytdlp.yml looks for.
          gh release upload "$TAG" artifacts/soundboard-*/*.zip --repo "$REPO" --clobber
          body=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)
          case "$body" in
            "Built with yt-dlp "*) ;;
            *) gh release edit "$TAG" --repo "$REPO" \
                 --notes "$(printf '%s\n\n%s' "$notes" "$body")" ;;
          esac
