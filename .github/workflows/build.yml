name: Build executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: soundboard-windows
          - os: macos-latest
            artifact: soundboard-macos
          - os: ubuntu-latest
            artifact: soundboard-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install -r requirements.txt -r build-requirements.txt

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --icon assets/icon.ico --add-data "assets/icon.png;assets" --collect-data customtkinter --collect-all yt_dlp --collect-all imageio_ffmpeg soundboard.py

      - name: Build executable (macOS)
        if: runner.os == 'macOS'
        run: |
          # A .app must be onedir; onefile .apps don't open reliably and can't be
          # granted Input Monitoring.
          pyinstaller --onedir --windowed --icon assets/icon.icns --add-data "assets/icon.png:assets" --collect-data customtkinter --collect-all yt_dlp --collect-all imageio_ffmpeg soundboard.py
          plutil -insert NSMicrophoneUsageDescription -string "Soundboard mixes your microphone with sound clips and sends them to your virtual audio cable." dist/soundboard.app/Contents/Info.plist
          codesign --force --deep -s - dist/soundboard.app

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --onefile --windowed --add-data "assets/icon.png:assets" --collect-data customtkinter --collect-all yt_dlp --collect-all imageio_ffmpeg soundboard.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\soundboard.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto keeps the bundle's symlinks; zip -r copies them and breaks the signature.
        run: ditto -c -k --keepParent dist/soundboard.app ${{ matrix.artifact }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r ../${{ matrix.artifact }}.zip soundboard

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Record yt-dlp version
        if: runner.os == 'Linux'
        run: python -c "import yt_dlp.version as v; print(v.__version__)" > ytdlp-version.txt

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ytdlp-version
          path: ytdlp-version.txt

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ytdlp-version
          path: .

      - name: Create GitHub release with builds attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # check-ytdlp.yml reads this line to spot outdated downloaders.
          gh release create "${{ github.ref_name }}" artifacts/soundboard-*/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Built with yt-dlp $(cat ytdlp-version.txt)" \
            --generate-notes
